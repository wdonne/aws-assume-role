[package]
default-run = "aws-assume-role"
description = "The AWS assume role operator"
edition = "2024"
exclude = ["*.iml"]
homepage = "https://github.com/wdonne/aws-assume-role"
keywords = ["aws", "iam", "kubernetes", "operator", "role"]
license = "BSD-2-Clause"
name = "aws-assume-role"
readme = "README.md"
repository = "https://github.com/wdonne/aws-assume-role"
version = "1.0.4"

[[bin]]
doc = false
name = "crdgen"
path = "src/crdgen.rs"

[lib]
name = "resource"
path = "src/resource.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
aws-sdk-ecr = "1.123.0"
aws-sdk-sts = "1.110.0"
base64 = "0.23.1"
chrono = "0.4.45"
env_logger = "0.11.11"
futures = "0.3.33"
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", features = ["client", "derive", "runtime"] }
kube-operator-util = "1.2.1"
log = "0.4.33"
rustls = { version = "0.23.43", features = ["ring"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34+deprecated"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4"] }
